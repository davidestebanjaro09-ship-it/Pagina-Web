<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opiniones - Proyecto L.U.Z.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- El menú de navegación -->
    <nav class="navbar">
        <div class="logo">
            <img class="logo-image" src="assets/logo-luz.png" alt="Logo de L.U.Z.">
            <span class="logo-text">Luz</span>
        </div>
        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="cabina.html">La Cabina</a>
            <a href="software.html">El Software</a>
            <a href="investigacion.html">Investigación</a>
            <a href="resenas.html" class="active">Opiniones</a> <!-- Nota la clase 'active' -->
        </div>
        <div class="nav-right">
            <span class="nav-help">Línea 106 - Ayuda inmediata</span>
        </div>
    </nav>

    <!-- Contenido exclusivo de esta pestaña -->
    <main class="reviews-section bg-light">
        <div class="reviews-container">
            <div class="reviews-header">
                <h2>Tu opinión cuenta</h2>
                <p>¿Qué piensas del proyecto Luz? Comparte tu reseña o sugerencia. Puedes dejar tu nombre o ser anónimo.</p>
            </div>

            <form id="review-form" class="review-form">
                <div class="form-group">
                    <label for="reviewer-name">Nombre (opcional)</label>
                    <input type="text" id="reviewer-name" placeholder="Puedes dejarlo en blanco">
                </div>
                
                <div class="form-group">
                    <label for="review-text">Tu opinión</label>
                    <textarea id="review-text" required placeholder="Cuéntanos qué te parece el proyecto..." rows="4"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Calificación</label>
                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5" required><label for="star5">★</label>
                        <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
                        <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
                        <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
                        <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Publicar opinión</button>
            </form>

            <div class="recent-reviews">
                <h3>Opiniones recientes</h3>
                <div id="reviews-list">
                    <p class="no-reviews-msg">Aún no hay opiniones. Sé el primero en compartir la tuya.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
