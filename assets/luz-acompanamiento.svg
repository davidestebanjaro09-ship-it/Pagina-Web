  <text x="450" y="652" fill="#526174" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing=".06em" text-anchor="middle">UN ESPACIO PARA ESCUCHAR · ORIENTAR · ACOMPAÑAR</text>
