    <path d="M273 415q47-69 106-48 26 9 43 34M625 416q-48-68-107-47-26 10-41 33" stroke="url(#wave-gold)" stroke-width="4" opacity=".85"/>
    <path d="M289 446q40-44 80-27M608 447q-38-44-80-28" stroke="#e9f8ff" stroke-width="3" opacity=".92"/>
