<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
  <title id="title">Un espacio para hablar a tu ritmo</title>
  <desc id="desc">Ilustración de una persona joven dentro de una cabina íntima revestida de paneles acústicos texturados. Ondas de luz azul y dorada la envuelven como manos que acompañan, junto a un perfil sereno. En la parte superior se lee: Sin presión. Sin juicios. A tu ritmo.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1f8fc"/>
      <stop offset=".55" stop-color="#e8f4f8"/>
      <stop offset="1" stop-color="#f8f5ed"/>
    </linearGradient>
    <linearGradient id="booth" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#20364b"/>
      <stop offset=".52" stop-color="#314b60"/>
      <stop offset="1" stop-color="#17283a"/>
    </linearGradient>
    <linearGradient id="warm-wall" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#725b4d"/>
      <stop offset=".52" stop-color="#55483f"/>
      <stop offset="1" stop-color="#3d3c3b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffe5a3" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffc76e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave-blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#43c6ea"/>
      <stop offset=".52" stop-color="#67aee8"/>
      <stop offset="1" stop-color="#9b8bea"/>
    </linearGradient>
    <linearGradient id="wave-gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe39c"/>
      <stop offset=".55" stop-color="#efb954"/>
      <stop offset="1" stop-color="#e98c67"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5686a0"/>
      <stop offset="1" stop-color="#315772"/>
    </linearGradient>
    <pattern id="egg-carton" width="70" height="58" patternUnits="userSpaceOnUse">
      <rect width="70" height="58" fill="#8d7667"/>
      <path d="M0 0h70v58H0z" fill="#634f46" opacity=".34"/>
      <path d="M-17 0 0 0 17 29 0 58h-17L0 29z" fill="#aa907d"/>
      <path d="M18 0h34l18 29-18 29H18l17-29z" fill="#937968"/>
      <path d="M0 0 17 29 0 58M35 0l17 29-17 29M70 0 53 29l17 29" fill="none" stroke="#d1b69c" stroke-opacity=".42" stroke-width="2"/>
      <ellipse cx="17" cy="29" rx="7" ry="10" fill="#53453f" opacity=".34"/>
      <ellipse cx="52" cy="29" rx="7" ry="10" fill="#51443e" opacity=".34"/>
      <path d="M12 24q5-8 10 0M47 24q5-8 10 0" fill="none" stroke="#d7bda2" stroke-opacity=".42" stroke-width="2"/>
    </pattern>
    <pattern id="ceiling-panels" width="56" height="48" patternUnits="userSpaceOnUse">
      <rect width="56" height="48" fill="#927d6c"/>
      <path d="M-14 0h28l14 24-14 24h-28L0 24zM42 0h28L56 24l14 24H42L28 24z" fill="#b59a80"/>
      <path d="M0 0 14 24 0 48M28 0l14 24-14 24M56 0 42 24l14 24" fill="none" stroke="#dbc4a7" stroke-opacity=".5" stroke-width="2"/>
      <ellipse cx="14" cy="24" rx="6" ry="8" fill="#604f45" opacity=".4"/>
      <ellipse cx="42" cy="24" rx="6" ry="8" fill="#604f45" opacity=".4"/>
    </pattern>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dy="13"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wave-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="booth-interior">
      <path d="M184 159 700 159 783 552 119 552z"/>
    </clipPath>
  </defs>

  <rect width="900" height="680" rx="30" fill="url(#backdrop)"/>
